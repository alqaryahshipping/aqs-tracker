<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vehicle &amp; Shipment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar with tabs; each tab is a full-width working surface (tables, boards). */
:root {
  --bg: #f6f7f8; --panel: #ffffff; --panel-2: #f0f2f4; --line: #dde1e5; --fg: #1b232b; --muted: #5f6b76;
  --accent: #1f6f8b; --accent-ink: #ffffff; --accent-soft: #e3f0f5;
  --ok: #2e7d4f; --warn: #b7791f; --bad: #c0392b; --grey: #9aa5af;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif: "IBM Plex Serif", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --panel: #1a2128; --panel-2: #212a32; --line: #2e3943; --fg: #e6ebef; --muted: #9aa7b2;
  --accent: #4fb0cf; --accent-ink: #0d1418; --accent-soft: #17303a;
  --ok: #5cc48a; --warn: #e0a84a; --bad: #ef6b5b; --grey: #6c7984; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12171c; --panel: #1a2128; --panel-2: #212a32; --line: #2e3943; --fg: #e6ebef; --muted: #9aa7b2;
  --accent: #4fb0cf; --accent-ink: #0d1418; --accent-soft: #17303a;
  --ok: #5cc48a; --warn: #e0a84a; --bad: #ef6b5b; --grey: #6c7984; color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 14px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.vt { font-variant-numeric: tabular-nums; }
.vt-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; box-shadow: 0 1px 0 rgba(0,0,0,.02); }
.vt-barrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px 28px; align-items: center; min-height: 44px; }
.vt-name { line-height: 1.2; white-space: nowrap; display: flex; align-items: center; gap: 10px; }
.vt-logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: inline-grid; place-items: center; flex: none; }
.vt-logo svg { width: 19px; height: 19px; }
.vt-iconbtn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.vt-iconbtn svg { width: 19px; height: 19px; }
.vt-iconbtn:hover { color: var(--fg); background: var(--panel-2); }
.vt-iconbtn[aria-current="page"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.vt-iconbtn-t { gap: 6px; } .vt-iconbtn-t svg { width: 16px; height: 16px; }
body.vt-locked #app, body.vt-locked .vt-mnav, body.vt-locked .vt-drawer, body.vt-locked .vt-msheet { display: none !important; }
.vt-login { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: var(--bg); }
.vt-login-card { width: min(100%, 380px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.08); display: flex; flex-direction: column; gap: 10px; }
.vt-login-brand { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.vt-login-card h2 { margin: 8px 0 0; font-size: 20px; }
.vt-login-form { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.vt-login-form label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 600; }
.vt-login-form input { height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; font: inherit; font-size: 15px; background: var(--panel); color: var(--fg); }
.vt-login-form input.is-invalid { border-color: var(--bad); box-shadow: 0 0 0 2px color-mix(in srgb, var(--bad) 22%, transparent); }
.vt-login-form .vt-btn { height: 42px; justify-content: center; font-size: 15px; }
.vt-login-err { color: var(--bad); font-size: 13px; font-weight: 600; min-height: 1em; }
.vt-mebtn { gap: 6px; } .vt-mebtn svg { width: 16px; height: 16px; } .vt-mebtn[data-arm] { color: var(--bad); border-color: var(--bad); }
.vt-adduser { margin-top: 12px; align-items: end; }
.vt-robanner { margin: 12px 20px 0; padding: 10px 14px; border: 1px solid #f59f00; background: color-mix(in srgb, #f59f00 12%, var(--panel)); border-radius: 10px; font-size: 13.5px; font-weight: 600; }
/* 'hidden' must always hide (claude.ai added this rule itself; the stand-alone site needs it, or styled tabs and buttons such as Rates and Export stay visible to Staff) */
[hidden]:not([hidden=until-found i]) { display: none !important; }
.vt-robanner[hidden] { display: none; }
.vt-tabsep { flex: none; width: 1px; align-self: center; height: 18px; background: var(--line); margin: 0 6px; }
.vt-topact { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
.vt-topact .vt-btn { height: 36px; display: inline-flex; align-items: center; }
.vt-barrow .vt-gsearch { justify-self: center; width: 100%; }
.vt-name { font-family: var(--serif); font-size: 20px; font-weight: 500; margin: 0; }
.vt-gsearch { position: relative; max-width: 42rem; display: flex; align-items: center; }
.vt-gsearch svg { position: absolute; left: 10px; width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.vt-gsearch input { width: 100%; box-sizing: border-box; height: 36px; padding: 0 64px 0 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); color: var(--fg); font: inherit; font-size: 13.5px; }
.vt-gsearch input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--panel); }
.vt-gsearch kbd { position: absolute; right: 8px; font: 11px var(--mono, monospace); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: var(--panel); pointer-events: none; }
.vt-gsearch input:focus ~ kbd, .vt-gsearch input:not(:placeholder-shown) ~ kbd { display: none; }
.vt-gs-pop { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: min(36rem, calc(100vw - 32px)); max-height: min(70vh, 34rem); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); z-index: 30; padding: 6px 0; }
.vt-gs-sec + .vt-gs-sec { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 4px; }
.vt-gs-head { display: flex; align-items: center; gap: 8px; padding: 6px 14px 4px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.vt-gs-head b { font-weight: 600; color: var(--fg); }
.vt-gs-head span { background: var(--panel-2); border-radius: 999px; padding: 0 7px; }
.vt-gs-all { margin-left: auto; border: 0; background: none; color: var(--accent); font: inherit; font-size: 11.5px; text-transform: none; letter-spacing: 0; cursor: pointer; padding: 2px 4px; }
.vt-gs-row { display: flex; align-items: center; gap: 10px; padding: 7px 14px; cursor: pointer; }
.vt-gs-row.is-active { background: var(--accent-soft); }
.vt-gs-row.is-more .vt-gs-main { color: var(--accent); font-size: 12.5px; }
.vt-gs-txt { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.vt-gs-main { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vt-gs-main.mono { font-family: var(--mono, monospace); }
.vt-gs-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vt-gs-right { font-size: 12.5px; white-space: nowrap; }
.vt-gs-row > :not(.vt-gs-txt) { white-space: nowrap; flex: none; font-size: 12px; }
.vt-gs-none { padding: 14px; color: var(--muted); font-size: 13px; }
@media (max-width: 760px) { .vt-barrow { grid-template-columns: minmax(0, 1fr) auto; } .vt-barrow .vt-gsearch { grid-column: 1 / -1; grid-row: 2; max-width: none; } .vt-name { white-space: normal; } }
@media (max-width: 640px) { .vt-gsearch { max-width: none; } .vt-gsearch kbd { display: none; } .vt-gs-pop { position: fixed; left: 12px; right: 12px; top: auto; min-width: 0; } }
.vt-sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.vt-sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); display: inline-block; }
.vt-sync.is-live i { background: var(--ok); }
.vt-tabs { display: flex; align-items: stretch; gap: 0 2px; margin-top: 10px; margin-left: -8px; overflow-x: auto; scrollbar-width: none; }
.vt-tabs::-webkit-scrollbar { display: none; }
.vt-tab .is-long { display: inline; }
.vt-tab { font: inherit; font-size: 14px; font-weight: 500; background: none; border: 0; border-bottom: 2.5px solid transparent; color: var(--muted); padding: 9px 12px 11px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px 6px 0 0; }
.vt-tab:hover { background: var(--panel-2); }
.vt-tab:hover { color: var(--fg); }
.vt-tab[aria-selected="true"] { color: var(--accent); font-weight: 600; border-bottom-color: var(--accent); }
.vt-tab b { font-weight: 600; font-size: 11.5px; color: var(--muted); margin-left: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.vt-tab b:empty { display: none; }
.vt-tab b.vt-badge { background: var(--bad); border-color: var(--bad); color: #fff; }
.vt-tab[aria-selected="true"] b:not(.vt-badge) { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft); }
.vt-main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: flex; flex-direction: column; gap: 16px; }
.vt-notice { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; color: var(--muted); }

.vt-btn { font: inherit; font-size: 13px; font-weight: 500; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; white-space: nowrap; }
.vt-btn:hover { border-color: var(--muted); }
.vt-btn.is-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.vt-btn.is-danger { color: var(--bad); }
.vt-btn.is-danger.is-armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.vt-btn:disabled { opacity: .5; cursor: default; }
.vt-btn:focus-visible, .vt-tab:focus-visible, .vt-card:focus-visible, .vt-colhead:focus-visible, .vt-table tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.vt-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.vt-f { display: flex; flex-direction: column; gap: 3px; flex: 1 1 9rem; max-width: 14rem; min-width: 0; }
.vt-f.is-wide { flex: 2 1 14rem; max-width: 22rem; }
.vt-f span { font-size: 11.5px; color: var(--muted); }
.vt-f input, .vt-f select, .vt-form input, .vt-form select, .vt-form textarea, .vt-paste textarea, .vt-inline {
  font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); min-width: 0; width: 100%; box-sizing: border-box; }
.vt-tools .vt-spacer { flex: 1 1 0; }

.vt-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 10rem), 1fr)); gap: 10px; }
.vt-kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.vt-kpi span { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.vt-kpi b { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.1; }
.vt-kpi b.is-bad { color: var(--bad); }
.vt-kpi small { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vt-kpi.is-click { font: inherit; color: inherit; text-align: left; cursor: pointer; transition: border-color .12s, background .12s, box-shadow .12s; }
.vt-kpi.is-click:hover { border-color: var(--accent); }
.vt-kpi.is-click.is-on { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.vt-kpi.is-click:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vt-kpis-9 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 8.2rem), 1fr)); gap: 8px; }
.vt-kpis-10 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 7.4rem), 1fr)); gap: 8px; }
.vt-kpis-9 .vt-kpi, .vt-kpis-10 .vt-kpi { padding: 10px 12px; }
.vt-tag.vt-tag-ok { margin-left: 6px; background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.vt-hist { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px; }
.vt-hist h4 { margin: 0; font-size: 13px; font-weight: 600; }
.vt-hist-l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.vt-hist-i { border-left: 3px solid var(--line); padding: 2px 0 2px 10px; font-size: 12.5px; }
.vt-hist-i.is-insert { border-left-color: var(--ok); } .vt-hist-i.is-delete { border-left-color: var(--bad); } .vt-hist-i.is-update { border-left-color: var(--accent); }
.vt-hist-h { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; }
.vt-hist-h span { color: var(--muted); } .vt-hist-h time { color: var(--muted); margin-left: auto; font-size: 12px; white-space: nowrap; }
.vt-hist-c { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
.vt-hist-c s { color: var(--muted); } .vt-hist-f { color: var(--muted); }
.vt-del td:last-child { white-space: nowrap; }
.vt-bulkpay td:first-child, .vt-bulkpay th:first-child { width: 1%; } .vt-bulkpay input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); } .vt-bulkpay .vt-inline { max-width: 9rem; }
.vt-del-detail td { background: var(--panel-2); cursor: default; white-space: normal; max-width: none; }
.vt-del-dl { display: grid; grid-template-columns: minmax(8rem, max-content) 1fr; gap: 3px 14px; margin: 4px 0; font-size: 12.5px; }
.vt-del-dl dt { color: var(--muted); } .vt-del-dl dd { margin: 0; overflow-wrap: anywhere; }
.vt-tag.vt-tag-bad { margin-left: 6px; background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.vt-fhint { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.vt-fhint.is-ok { color: var(--ok); } .vt-fhint.is-bad { color: var(--bad); }
.vt-tt-sel { min-width: 9rem; }
.vt-kpis-6 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); }
.vt-kpi i, .vt-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.vt-card-box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vt-boxhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.vt-boxhead h2 { margin: 0; font-size: 15px; font-weight: 600; }
.vt-note { margin: 0; font-size: 12px; color: var(--muted); }
.vt-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); align-items: center; }
.vt-legend span { display: inline-flex; gap: 5px; align-items: center; }

.vt-scroll { overflow-x: auto; overscroll-behavior-x: contain; padding-bottom: 4px; }
.vt-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(14rem, 1fr); gap: 8px; align-items: start; }
.vt-col { background: var(--bg); border: 1px solid var(--line); border-top: 3px solid var(--sev, var(--line)); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; }
.vt-col.is-past { opacity: .8; }
.vt-col.is-now { box-shadow: 0 0 0 2px var(--accent); }
.vt-colhead { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 10px 12px; border-bottom: 1px solid var(--line); width: 100%; }
.vt-colrow { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.vt-colname { font-weight: 600; font-size: 13.5px; }
.vt-colnum { font-family: var(--serif); font-size: 20px; }
.vt-sub { font-size: 12px; color: var(--muted); }
.vt-tag { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); margin-left: 6px; font-weight: 500; vertical-align: 1px; }
.vt-tag.is-quiet { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.vt-cards { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
.vt-empty { font-size: 12px; color: var(--muted); padding: 8px 4px; }
.vt-card { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 5px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); width: 100%; }
.vt-card:hover { border-color: var(--muted); }
.vt-card.is-picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.vt-card.is-late { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); background: color-mix(in srgb, var(--bad) 6%, var(--panel)); }
.vt-meta.is-bad { color: var(--bad); font-weight: 600; }
.vt-cardtop { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.vt-cardtop b { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vt-cardtop strong { font-family: var(--serif); font-weight: 400; font-size: 18px; line-height: 1; }
.vt-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
.vt-bar span { display: block; height: 100%; }
.vt-meta { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.vt-meta.is-strong { color: var(--fg); }

.vt-tablebox { overflow: auto; max-height: 34rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }
.vt-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.vt-table th { position: sticky; top: 0; z-index: 1; background: var(--panel-2); text-align: left; font-weight: 500; color: var(--muted); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; }
.vt-table th.num, .vt-table td.num { text-align: right; }
.vt-table th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
.vt-table th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
.vt-table td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 16rem; overflow: hidden; text-overflow: ellipsis; }
.vt-table tbody tr { cursor: pointer; }
.vt-table tbody tr:hover td { background: var(--accent-soft); }
.vt-table tr.is-exited td { color: var(--muted); }
.vt-pager { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }
.vt-pager-nav { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.vt-pager select { font: inherit; font-size: 12.5px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.vt-pager-size { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.vt-ss-btn { font: inherit; font-size: 13px; text-align: left; padding: 6px 26px 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); cursor: pointer; min-width: 0; width: 100%; box-sizing: border-box; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.vt-ss-btn::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.vt-ss-btn:disabled { opacity: .6; cursor: default; }
.vt-grid th.is-title { background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); color: var(--fg); }

  // ---------- Inbox read / unread (per user) ----------
  const ibKey = (r, it) => `${r.id}|${it.id}`;
  const ibIsRead = (r, it) => !!S.ibRead[ibKey(r, it)];
  const ibLocalKey = () => `vt-ibread:${S.uid || 'me'}`;
  let ibSyncT = null;
  function persistIbRead() {
    // drop marks for items that have left the inbox, so a problem that comes back shows as unread again
    if (S.ready.v && S.ready.c && S.ready.y) try { const live = new Set(inboxRules().flatMap((r) => r.list.map((it) => ibKey(r, it)))); for (const k of Object.keys(S.ibRead)) if (!live.has(k)) delete S.ibRead[k]; } catch (_) {}
    try { localStorage.setItem(ibLocalKey(), JSON.stringify(S.ibRead)); } catch (_) {}
    clearTimeout(ibSyncT);
    ibSyncT = setTimeout(() => { if (S.db && S.uid) S.db.doc(`data/users/${S.uid}/inboxRead`).set({ items: JSON.stringify(S.ibRead), updatedAt: stamp() }).catch(() => {}); }, 1000);
  }
  function setIbRead(pairs, read) { for (const [r, it] of pairs) { const k = ibKey(r, it); if (read) S.ibRead[k] = TODAY_ISO; else delete S.ibRead[k]; } persistIbRead(); render(); }
  async function loadIbRead() {
    try { S.ibRead = JSON.parse(localStorage.getItem(ibLocalKey()) || '{}') || {}; } catch (_) { S.ibRead = {}; }
    if (S.db && S.uid) { try { const snap = await S.db.doc(`data/users/${S.uid}/inboxRead`).get(); if (snap.exists) { const remote = JSON.parse(snap.data().items || '{}'); S.ibRead = { ...S.ibRead, ...remote }; } } catch (_) {} }
    render();
  }
  function inboxUnread() { if (!(S.ready.v && S.ready.c && S.ready.y)) return null; try { return inboxRules().filter((r) => r.sev !== 'data').reduce((a, r) => a + r.list.filter((it) => !ibIsRead(r, it)).length, 0); } catch (_) { return null; } }
  function inboxOpen(it, r) {
    if (r && !ibIsRead(r, it)) setIbRead([[r, it]], true);
    if (it.kind === 'voy') return openVoyage(it.rid);
    if (it.kind === 'veh' && r && /^W/.test(r.id)) { S.drawer = { mode: 'tow', id: it.rid }; render(); return; }
    if (it.kind === 'veh' && r && /^T/.test(r.id)) { S.drawer = { mode: 'title', id: it.rid }; render(); return; }
    if (it.kind === 'rate') { const r = it.rate; S.rf.month = THIS_MONTH; S.drawer = { mode: 'edit', kind: 'rate', id: null, preset: { month: THIS_MONTH, agent: r.agent, line: r.line, size: r.size, origin: r.origin, pod: r.pod, all_in: r.all_in || 'No', free_days: r.free_days } }; return render(); }

      sel.hidden = true;
      sel.after(wrap);
    }
  }
  new MutationObserver(() => { enhanceSelects(document.body); }).observe(document.body, { childList: true, subtree: true });

  // ---------- global search (header) ----------
  const GS = { q: '', items: [], active: 0, t: null };
  const gsIn = $('#gs'), gsPop = $('#gsPop');
  function gsMatch(hay, toks) { const s = hay.toLowerCase(); return toks.every((t) => s.includes(t)); }
  function gsRank(id, q) { const s = String(id || '').toLowerCase(); return s === q ? 0 : s.startsWith(q) ? 1 : s.includes(q) ? 2 : 3; }
  function gsSections(qRaw) {
    const q = qRaw.trim().toLowerCase(); const toks = q.split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    const take = (arr, idOf) => arr.sort((a, b) => gsRank(idOf(a), q) - gsRank(idOf(b), q));
    const out = [];
    const veh = take([...S.veh.values()].filter((v) => gsMatch([v.vin, v.t_track, v.vehicle, v.shipper, vehCustomer(v), v.container, v.buyer, v.status, v.title, v.remarks, v.no].map(norm).join(' '), toks)), (v) => v.vin);
    out.push({ key: 'veh', label: 'Vehicles', tab: 'vehicles', rows: veh, item: (v) => ({ main: v.vin, mono: true, sub: [v.vehicle, v.shipper, vehCustomer(v), v.container ? `in ${v.container}` : isOnHand(v) ? 'On hand' : (v.exit_reason || 'Exited'), v.buyer].filter(Boolean).join(' · '), open: () => openEditor('veh', v.id) }),
      all: () => { S.vf.q = qRaw.trim(); S.vf.sub = veh.some((v) => !v.container && isOnHand(v)) ? 'onhand' : veh.some((v) => v.container) ? 'shipped' : 'other'; S.vf.shipper = []; S.vf.status = []; S.vf.title = []; S.vf.yard = []; S.vf.ev = []; S.vf.ready = false; go('vehicles'); } });
    const cons = take([...S.con.values()].filter((c) => gsMatch([c.container, c.booking, c.shipper, c.customer, c.voyage, c.vessel, c.line, c.pod, c.status, c.clearance, c.size, c.notes].map(norm).join(' '), toks)), (c) => c.container);
    out.push({ key: 'con', label: 'Containers', tab: 'containers', rows: cons, item: (c) => ({ main: c.container, mono: true, sub: [c.customer, c.voyage, c.booking ? `Booking ${c.booking}` : '', `${carsIn(c.container).length} car(s)`].filter(Boolean).join(' · '), pill: c.status, color: conColor(c.status), open: () => openEditor('con', c.id) }),
      all: () => { const by = {}; cons.forEach((c) => { const g = conGroupOf(c); by[g] = (by[g] || 0) + 1; }); Object.assign(S.cf, { q: qRaw.trim(), shipper: '', status: '', pod: '', voyage: '', customer: '', sub: Object.entries(by).sort((a, b) => b[1] - a[1])[0]?.[0] || S.cf.sub }); go('containers'); } });
    const voys = take([...S.voy.values()].filter((y) => gsMatch([voyLabel(y), y.vessel, y.voyage_no, y.line, y.origin, y.pod, y.status, y.notes].map(norm).join(' '), toks)), (y) => y.vessel || y.voyage_no);
    out.push({ key: 'voy', label: 'Voyages', tab: 'voyages', rows: voys, item: (y) => ({ main: voyLabel(y), sub: [y.line, y.origin ? `from ${y.origin}` : '', `${consIn(y.id).length} container(s)`].filter(Boolean).join(' · '), pill: y.status, open: () => openVoyage(y.id) }),
      all: () => { Object.assign(S.yf, { q: qRaw.trim(), status: '', line: '', pod: '' }); go('voyages'); } });
    const cus = take([...S.cus.values()].filter((c) => c.id !== UNASSIGNED && gsMatch([c.name, c.contact, c.phone, c.email, c.city, c.notes].map(norm).join(' '), toks)), (c) => c.name);
    out.push({ key: 'cus', label: 'Customers', tab: 'customers', rows: cus, item: (c) => { const s = cusStats(c.id); return { main: c.name, sub: [c.contact, c.phone, `${s.n} container(s)`, `${s.cars} car(s)`].filter(Boolean).join(' · '), open: () => { S.drawer = { mode: 'edit', kind: 'cus', id: c.id }; render(); } }; },
      all: () => { S.uf.q = qRaw.trim(); go('customers'); } });
    if (S.canAdmin) {
      const rates = [...S.rates.values()].filter((r) => gsMatch([r.agent, r.line, r.origin, r.pod, r.size, r.notes, fmtMonth(r.month), r.month].map(norm).join(' '), toks)).sort((a, b) => String(b.month).localeCompare(String(a.month)));
      out.push({ key: 'rate', label: 'Freight prices', tab: 'rates', rows: rates, item: (r) => ({ main: `${r.agent} · ${r.line}`, sub: `${r.origin} → ${r.pod} · ${r.size} · ${fmtMonth(r.month)}`, right: `${fmtN(r.rate)} USD`, open: () => { S.drawer = { mode: 'edit', kind: 'rate', id: r.id }; render(); } }),
        all: () => { Object.assign(S.rf, { q: qRaw.trim(), view: 'card', month: rates[0] ? rates[0].month : S.rf.month, agent: '', line: '', origin: '', pod: '', size: '' }); S.rateEl = null; go('rates'); } });
    }
    return out.filter((s) => s.rows.length);
  }
  function gsClose() { gsPop.hidden = true; gsIn.setAttribute('aria-expanded', 'false'); }
  function gsDraw() {
    const secs = gsSections(GS.q);
    GS.items = [];
    if (!GS.q.trim()) { gsClose(); return; }
    const PER = 6;
    const kids = secs.length ? secs.map((s) => {
      const shown = s.rows.slice(0, PER).map((r) => { const it = s.item(r); GS.items.push(it); return it; });
      const more = s.rows.length > PER ? { main: `Show all ${fmtN(s.rows.length)} in ${s.label}`, isMore: true, open: s.all } : null;
      if (more) GS.items.push(more);
      return h('div', { class: 'vt-gs-sec' },
        h('div', { class: 'vt-gs-head' }, h('b', { text: s.label }), h('span', { text: fmtN(s.rows.length) }), h('button', { type: 'button', class: 'vt-gs-all', onclick: () => { gsClose(); s.all(); } }, 'Open list →')),
        ...shown.map((it) => gsRow(it)), more ? gsRow(more) : null);
    }) : [h('div', { class: 'vt-gs-none', text: `Nothing matches "${GS.q.trim()}".` })];
    GS.active = Math.min(GS.active, Math.max(0, GS.items.length - 1));
    gsPop.replaceChildren(...kids);
    gsPop.hidden = false; gsIn.setAttribute('aria-expanded', 'true');
    if (window.innerWidth <= 640) { const r = gsIn.getBoundingClientRect(); gsPop.style.top = (r.bottom + 6) + 'px'; gsPop.style.maxHeight = `calc(100vh - ${Math.round(r.bottom + 18)}px)`; } else { gsPop.style.top = ''; gsPop.style.maxHeight = ''; }
    gsPaint();
  }
  function gsRow(it) {
    const i = GS.items.indexOf(it);
    const el = h('div', { class: 'vt-gs-row' + (it.isMore ? ' is-more' : ''), role: 'option', 'data-i': i },
      h('div', { class: 'vt-gs-txt' }, h('span', { class: 'vt-gs-main' + (it.mono ? ' mono' : ''), text: it.main }), it.sub ? h('span', { class: 'vt-gs-sub', text: it.sub }) : null),
      it.pill ? statusPill(it.pill, it.color) : null, it.right ? h('b', { class: 'vt-gs-right', text: it.right }) : null);
    el.addEventListener('mousedown', (e) => { e.preventDefault(); gsGo(i); });
    el.addEventListener('mousemove', () => { if (GS.active !== i) { GS.active = i; gsPaint(); } });
    return el;
  }
  function gsPaint() { gsPop.querySelectorAll('.vt-gs-row').forEach((el) => { const on = +el.dataset.i === GS.active; el.classList.toggle('is-active', on); if (on && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' }); }); }
  function gsGo(i) { const it = GS.items[i]; if (!it) return; gsClose(); gsIn.blur(); it.open(); }
  gsIn.addEventListener('input', () => { GS.q = gsIn.value; GS.active = 0; clearTimeout(GS.t); GS.t = setTimeout(gsDraw, 120); });
  gsIn.addEventListener('focus', () => { if (gsIn.value.trim()) gsDraw(); });
  gsIn.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); GS.active = Math.min(GS.active + 1, GS.items.length - 1); gsPaint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); GS.active = Math.max(GS.active - 1, 0); gsPaint(); }
    else if (e.key === 'Enter') { e.preventDefault(); clearTimeout(GS.t); if (gsPop.hidden) gsDraw(); gsGo(GS.active); }
    else if (e.key === 'Escape') { e.stopPropagation(); if (gsIn.value) { gsIn.value = ''; GS.q = ''; gsClose(); } else gsIn.blur(); }
  });
  document.addEventListener('mousedown', (e) => { if (!gsPop.hidden && !e.target.closest('.vt-gsearch')) gsClose(); });
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '') || (document.activeElement && document.activeElement.isContentEditable);
    if (((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) || (e.key === '/' && !typing)) { e.preventDefault(); gsIn.focus(); gsIn.select(); }
  });

  // ---------- tabs & routing ----------
  const TABS = ['inbox', 'vehicles', 'towing', 'titles', 'containers', 'voyages', 'clearance', 'onhand', 'towboard', 'shipments', 'rates', 'customers', 'settings', 'bulk'];
  function go(tab) { if (!TABS.includes(tab)) tab = P().tab || 'onhand'; if (S.tab !== tab) { S.tab = tab; if (tab === 'shipments') S.scrollNow = true; } if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab); render(); }
  document.querySelectorAll('.vt-tab').forEach((t) => t.addEventListener('click', () => go(t.dataset.tab)));
  { const sb = document.getElementById('setBtn'); if (sb) sb.addEventListener('click', () => go('settings')); }
  { const mb = document.getElementById('meBtn'); if (mb) mb.addEventListener('click', () => { if (mb.dataset.arm) { delete mb.dataset.arm; signOut(); } else { mb.dataset.arm = '1'; mb.querySelector('span').textContent = 'Sign out?'; setTimeout(() => { delete mb.dataset.arm; render(); }, 3000); } }); }
  document.querySelectorAll('#mnav button[data-m]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.m === 'more') openMore(); else { closeMore(); go(b.dataset.m); } }));
  $('#msheet').addEventListener('click', (e) => { if (e.target.dataset.close) closeMore(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#msheet').hidden) closeMore(); });
  window.matchMedia('(max-width: 760px)').addEventListener('change', () => render());
  window.addEventListener('hashchange', () => go(location.hash.slice(1)));

  // ---------- data subscriptions ----------
  const subs = { veh: [], con: [] }, subKey = { veh: '', con: '' };
  function setSync(live, text) { const sync = $('#sync'); sync.classList.toggle('is-live', live); sync.lastChild.textContent = text; }
  function subscribe(kind) {
    const known = L('shippers').slice(0, 30);
    const key = JSON.stringify(known);
    if (subKey[kind] === key) return;
    subKey[kind] = key;
    subs[kind].forEach((u) => { try { u(); } catch (_) {} });
    subs[kind] = [];
    const parts = new Map();
    const c = coll(kind);
    const queries = known.map((s) => [s, c.where('shipper', '==', s).limit(1000)]);
    queries.push(['__other', known.length ? c.where('shipper', 'not-in', known).limit(1000) : c.limit(1000)]);
    const merge = () => {
      if (parts.size < queries.length) return;
      const m = new Map();
      for (const docs of parts.values()) for (const d of docs) m.set(d.id, { id: d.id, ...d.data() });
      if (kind === 'veh') { S.veh = m; S.ready.v = true; } else { S.conRaw = m; rebuildCon(); S.ready.c = true; }
      setSync(true, 'Live'); render();
    };
    for (const [k, q] of queries) {
      subs[kind].push(q.onSnapshot((snap) => { parts.set(k, snap.docs); if (snap.size >= 1000) toast(`More than 1,000 ${kind === 'veh' ? 'vehicles' : 'containers'} for one shipper: some are not shown.`, true); merge(); },
        (e) => { setSync(false, 'Not connected'); if (e && e.code === 'revoked') { S.db = null; S.dbMissing = true; } render(); }));
    }
  }
  function watchPickups() {
    // max 1000 docs per query: split by auction so the master can grow past 1000 locations
    const parts = {}; const c = coll('pick');
    const merge = () => { S.pick = new Map(Object.values(parts).flat()); render(); };
    [['copart', c.where('auction', '==', 'Copart').limit(1000)], ['iaa', c.where('auction', '==', 'IAA').limit(1000)], ['other', c.where('auction', 'not-in', ['Copart', 'IAA']).limit(1000)], ['none', c.where('auction', '==', null).limit(1000)]]
      .forEach(([k, q]) => q.onSnapshot((snap) => { parts[k] = snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]); merge(); }, (e) => { console.warn('pickups', k, e); }));
  }
  function watchDecl() {
    coll('decl').limit(1000).onSnapshot((snap) => { S.decl = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }])); render(); }, (e) => { console.warn('declarations', e); S.decl = S.decl || new Map(); });
  }
  function watchCarriers() {
    coll('carr').limit(1000).onSnapshot((snap) => { S.carr = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }])); S.ready.k = true; render(); }, () => { S.ready.k = true; render(); });
  }
  function watchVoyages() {
    coll('voy').limit(1000).onSnapshot((snap) => {
      S.voy = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      S.ready.y = true; rebuildCon(); render();
    }, () => { setSync(false, 'Not connected'); render(); });
  }
  function watchCustomers() {
    coll('cus').limit(1000).onSnapshot((snap) => {
      S.cus = new Map(snap.docs.map((d) => [d.id, { id: d.id, ...d.data() }]));
      S.ready.u = true; rebuildCon(); render();
    }, () => { S.ready.u = true; setSync(false, 'Not connected'); render(); });
  }
  function watchLists() {
    let first = true;
    const start = () => { if (first) { first = false; subscribe('veh'); subscribe('con'); } };
    S.db.doc('settings/lists').onSnapshot((snap) => {
      const d = snap.exists ? snap.data() : null;
      const next = JSON.parse(JSON.stringify(DEFAULT_LISTS));
      if (d) for (const k of Object.keys(DEFAULT_LISTS)) if (Array.isArray(d[k])) next[k] = d[k].map(String);
      next.placeCountry = d && d.placeCountry && typeof d.placeCountry === 'object' ? { ...d.placeCountry } : {};
      if (d && !Array.isArray(d.shippers) && (Array.isArray(d.vShippers) || Array.isArray(d.cShippers))) next.shippers = [...new Set([...(d.vShippers || []), ...(d.cShippers || []), ...SHIPPERS])];
      if (!next.exits.includes('Loaded')) next.exits.push('Loaded');
      if (d && Array.isArray(d.partners)) { S.partners = d.partners.map((x) => ({ name: String(x.name), loader: !!x.loader, agent: !!x.agent, locs: Array.isArray(x.locs) ? x.locs.map(String) : [] })); next.shippers = S.partners.filter((x) => x.loader).map((x) => x.name); next.agents = S.partners.filter((x) => x.agent).map((x) => x.name); }
      else S.partners = partnersFrom(next);
      if (d && Array.isArray(d.tTypes)) { S.tTypes = d.tTypes.map((x) => ({ name: String(x.name), export: x.export === 'Yes' ? 'Yes' : x.export === 'No' ? 'No' : '' })); next.titleTypes = S.tTypes.map((x) => x.name); }
      else S.tTypes = typesFrom(next.titleTypes);
      if (d && Array.isArray(d.tLocs) && d.tLocs.length) { const core = new Set(CORE_TLOCS.map((x) => x[0])); S.tLocs = d.tLocs.map((x) => ({ id: String(x.id), label: String(x.label || x.id), base: core.has(String(x.base)) ? String(x.base) : 'auction', core: core.has(String(x.id)) })); for (const [id, label] of CORE_TLOCS.slice(1)) if (!S.tLocs.some((x) => x.id === id)) S.tLocs.push({ id, label, base: id, core: true }); }
      S.lists = next;
      start(); subscribe('veh'); subscribe('con');
      render();
    }, () => { start(); render(); });
    setTimeout(start, 4000);
  }

  // ---------- boot ----------
  loadLocalPrefs(); applyPrefs();
  S.tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : (TABS.includes(P().tab) ? P().tab : 'onhand');
  if (S.tab === 'shipments') S.scrollNow = true;
  render();
  if (window.SB) SB.refresh().then(render, () => { SB.state = 'login'; render(); });
  (async () => {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db) { S.dbMissing = true; setSync(false, 'Not signed in'); render(); return; }
    S.db = db;
    let can = null;
    try { can = user ? await user.can('data.write') : null; } catch (_) { can = null; }
    S.canWrite = can !== false;
    try { S.canAdmin = user ? !!(await user.canEdit()) : false; } catch (_) { S.canAdmin = false; }
    S.permDone = true;
    try { S.uid = user ? await user.id() : null; } catch (_) { S.uid = null; }
    if (S.uid) {
      try {
        const snap = await db.doc(`data/users/${S.uid}/prefs`).get();
        if (snap.exists) { const p = snap.data(); for (const k of Object.keys(DEFAULT_PREFS)) if (p[k] != null) S.prefs[k] = p[k]; S.prefsWhere = 'account'; applyPrefs(); if (!location.hash && TABS.includes(S.prefs.tab)) S.tab = S.prefs.tab; }
      } catch (_) {}
    }
    loadAccountDrafts();
    loadIbRead();
    watchRates();
    watchInboxCfg();
    watchAuth(); watchLists();
    watchVoyages();
    watchCustomers();
    watchCarriers(); watchPickups(); watchDecl();
    render();
  })();
})();
